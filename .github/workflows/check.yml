name: API-teszt
# Kézi indítás: ellenőrzi az OddsPapi-kulcsot és az ingyenes végpontot. Legfeljebb 3 fizetős kérés.
on:
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python check_api.py
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
