name: Tippmix value-bot

# Folyamatos működés: egy futás kb. 5,5 órán át 20 percenként lefuttatja a botot, a végén elindítja saját magát.
# A GitHub-ütemező nyilvános repóknál nagyon késhet, ezért a cron csak tartalék (ha a lánc megszakadna, újraindítja).
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write            # a data/ (fogadási napló) visszacommitolásához és a gh-pages dashboardhoz
  actions: write             # a következő kör elindításához

concurrency:
  group: tippmix-bot-loop
  cancel-in-progress: false  # ha már fut egy kör, az új megvárja (a cron-tartalék így nem dupláz)

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Bot 5 percenként gyors kör, 20 percenként teljes kör (kb. 5,5 óra)
        run: python loop.py
        env:
          LOOP_MINUTES: "325"
          INTERVAL_MINUTES: "5"
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
      - name: Következő kör indítása
        if: always()
        run: |
          curl -sS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/bot.yml/dispatches" -d '{"ref":"main"}' \
            && echo "Következő kör elindítva."
