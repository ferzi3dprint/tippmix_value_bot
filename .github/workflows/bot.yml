name: Tippmix value-bot

on:
  schedule:
    # 20 percenként reggeltől éjfélig (UTC 5–22 = budapesti 6/7–23/24). Nyilvános repóban az Actions-percek ingyenesek.
    # A GitHub-cron terheléskor késhet; egy futás ingyenes módban kb. 5–12 perc (5 mp várakozás meccsenként).
    - cron: "4,24,44 5-22 * * *"
  workflow_dispatch: {}      # kézi futtatás: Actions → Tippmix value-bot → Run workflow

permissions:
  contents: write            # a data/ (fogadási napló) visszacommitolásához

concurrency:
  group: tippmix-bot-data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Elszámolás, value-keresés, szimulált fogadás, értesítés
        run: python bot.py
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Napló visszacommitolása
        if: success() || failure()
        run: |
          git config user.name "tippmix-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Nincs változás."; exit 0; fi
          git commit -q -m "Napló: $(date -u +%Y-%m-%dT%H:%M)"
          for i in 1 2 3 4 5; do
            if git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 7))
          done
          echo "A visszacommitolás nem sikerült."; exit 1
      - name: Dashboard frissítése
        if: success() || failure()
        run: python -m dashboard.build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}               # közzététel a gh-pages ágra (ugyanez a repó)
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}         # csak ha külön dashboard-repó van beállítva
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}   # opcionális: ha megadod, titkosított az oldal
      - name: Salt-fájl mentése (csak az első dashboard-buildnél változik)
        if: success() || failure()
        run: |
          git add data/dashboard_kdf.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Dashboard salt" && git pull -q --rebase origin main && git push -q origin HEAD:main
