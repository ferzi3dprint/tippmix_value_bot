name: Telegram-teszt
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python telegram_test.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Chat ID mentése
        if: always()
        run: |
          git add data/telegram_chat.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git -c user.name=tippmix-bot -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -q -m "Telegram chat ID"
          git pull -q --rebase origin main && git push -q origin HEAD:main
