# Tippmix value-bet szimulátor – beállítások
# Minden pénzösszeg forintban. A bot NEM fogad valódi pénzzel: csak szimulál és naplóz.

timezone: Europe/Budapest

api:
  # free: az ingyenes OddsPapi-csomaghoz (havi 250 kérés). Az oddsokat a díjmentes historical-odds végpontból veszi,
  #       a havi keretből csak a napi meccslista és az elszámolás fogy.
  # paid: fizetős csomaghoz (odds-by-tournaments, sok bajnokság egyszerre).
  # hu:   magyar mód (alapbeállítás) – a Tippmix-oddsokat közvetlenül a tippmixpro.hu nyilvános adatfolyamából olvassa,
  #       a Pinnacle-t az OddsPapi díjmentes végpontjából; csak a mai meccsek.
  mode: hu
  base_url: https://api.oddspapi.io
  soft_book: tippmixpro        # amit "megfogadunk"
  sharp_book: pinnacle         # a viszonyítási alap (fair ár)
  # Kvótavédelem: a /v4/account (ingyenes hívás) alapján a havi keretet egyenletesen osztja el a hónap hátralévő napjaira.
  quota_reserve: 10            # ennyi kérést mindig tartalékban hagy
  max_settlement_calls_per_run: 15
  tournaments_refresh_hours: 6 # ilyen gyakran keresi újra, mely bajnokságokban van Tippmix + Pinnacle odds
  tournaments_per_call: 10     # odds-by-tournaments: ennyi bajnokság egy kérésben

classic:                       # klasszikus (lottózós) Tippmix: külön tőke, külön kimutatás; ugyanazok a szűrők
  enabled: true
hu:                            # csak mode: hu esetén
  match_threshold: 0.72        # Tippmix ↔ Pinnacle névegyezés küszöbe (0–1)
  max_prob_diff: 0.15          # ha a két iroda fő piaca ennél jobban eltér, a párosítás valószínűleg téves -> kihagyja
  fast_minutes: 5              # gyors kör: a hamarosan kezdődő meccsek ilyen gyakran (a teljes kör marad 20 percenként)
  fast_window_hours: 2         # ennyin belül kezdődő meccsekre vonatkozik a gyors kör
  full_every_minutes: 20
  days_ahead: 1                # 0 = csak a mai meccsek, 1 = ma és holnap (a korai, „nyitó” Tippmix-oddsok miatt)
  consensus_books: [sbobet, marathonbet]  # ha a Pinnacle nem árazza a piacot: ezek árrés-mentes átlaga a fair ár
  consensus_min_books: 2
  full_list_hours: 3           # a teljes Tippmix-kínálat (bajnokságonként) frissítése ilyen gyakran

free:                          # mode: free és hu esetén
  discovery_hours: 24          # meccslista frissítése (sportáganként 1 fizetős kérés) – ennél gyakrabban ne
  discovery_window_hours: 48   # a meccslista ennyi órára előre
  max_fixtures_per_run: 150    # ingyenes Pinnacle-kérések futásonként (5 mp/kérés -> ~12 perc, belefér a 20 perces körbe)
  near_start_hours: 6          # az ennyin belül kezdődő meccseket minden futás nézi
  far_recheck_minutes: 90      # a távolabbiakat ennyi percenként
  max_bets_per_day: 3          # legalább ennyi/nap; ha a havi keretből több maradt, a bot automatikusan többet enged
                               # (4 sportág meccslistája ~120/hó + 3 fogadás/nap ~90/hó + piaclista ≈ 220 a 250-ből)

scan:
  sports: all                  # minden sportág, amit a Tippmix kínál (a meccslista 1 fizetős kérés naponta, sportágtól függetlenül)
  lookahead_hours: 36          # ennyi órán belül kezdődő meccseket vizsgál
  min_minutes_before_start: 20 # ennél közelebb a kezdéshez már nem "fogad"
  max_sharp_overround: 1.08    # ha a Pinnacle árrése ennél nagyobb, a piac nem megbízható viszonyítási alap
  devig_method: power          # power (pontosabb a favorit–esélytelen torzításnál) vagy multiplicative
  skip_player_props: true

filters:
  min_odds: 1.10
  max_odds: 5.00
  # Odds-sávonkénti minimális várható érték (EV). Alacsony oddsnál kisebb a szórás, ezért kisebb küszöb is elég.
  ev_bands:
    - {max_odds: 1.60, min_ev: 0.02}
    - {max_odds: 2.10, min_ev: 0.03}
    - {max_odds: 2.50, min_ev: 0.04}
    - {max_odds: 99.0, min_ev: 0.06}    # 2.50–5.00: nagyobb szórás és bizonytalanabb fair ár -> szigorúbb küszöb
  consensus_extra_ev: 0.015    # konszenzusos (nem Pinnacle) fair árnál ennyivel szigorúbb az EV-küszöb
  max_market_prob_diff: 0.12   # ha egy piacon a két iroda valószínűségei ennél jobban eltérnek: hibás párosítás/vonal -> kihagyja
  max_ev: 0.25                 # ennél nagyobb EV szinte mindig adathiba (pl. eltérő piacszabály) – kihagyja
  max_bets_per_fixture: 1      # egy meccsre legfeljebb ennyi szimulált fogadás (korrelált fogadások kerülése)

staking:
  start_bankroll: 100000
  kelly_fraction: 0.25         # negyed-Kelly: lassabb, de sokkal kisebb a visszaesés
  max_stake_pct: 0.03          # egy fogadás legfeljebb a tőke 3%-a (ha a sáv nem mond mást)
  # Alacsony oddsnál a Kelly ugyanakkora előnyre nagyobb tétet ad (a nyerés valószínűbb) – a plafon is nagyobb:
  max_stake_bands:
    - {max_odds: 1.30, pct: 0.06}
    - {max_odds: 1.60, pct: 0.045}
    - {max_odds: 99.0, pct: 0.03}
  min_stake: 200
  round_to: 50
  max_open_exposure_pct: 0.35  # a nyitott fogadások együtt legfeljebb a tőke 35%-a

steam:                         # ⚡ Pinnacle odds-mozgás: a Tippmix ilyenkor gyakran késve követi a piacot
  enabled: true
  window_hours: 3              # ennyi időn belüli mozgást figyel
  min_age_minutes: 20          # a viszonyítási pont legalább ennyi perces legyen
  min_move: 0.04               # a fair valószínűség legalább ennyivel (relatív) nőtt -> steam (pl. 50% -> 52%)
  recheck_fixtures: 6          # futásonként legfeljebb ennyi steam-es meccset néz újra a futás végén (meccsenként 1 kérés)

execution:                     # végrehajthatóság: megtehető lett volna-e a fogadás, mire odaérsz a Tippmixhez?
  enabled: true
  confirm_after_minutes: 3     # a jelzés után ennyi perccel újra lekéri a Tippmix-oddsot (a futáson belül vár)
  # Ha addigra esett az odds, de még pozitív az EV: a fogadás az új (rosszabb) oddsszal számít.
  # Ha már nem pozitív, vagy a piac lezárt: "nem volt megtehető", kimarad az eredményből (de a statisztikában látszik).
  min_ev_after_move: 0.01      # „megéri legalább X oddsig”: az az odds, ahol az EV még +1% (az üzenetben is ez szerepel)

settlement:
  settle_after_hours: 3      # a kezdés után ennyivel próbál először elszámolni
  retry_hours: 2               # ha még nincs eredmény, ennyi óra múlva próbálja újra (minden próba 1 fizetős kérés)
  give_up_after_hours: 96      # ha addig sincs eredmény: visszajár a tét (érvénytelen)

notify:
  each_run_new_bets: true      # minden futás után egy üzenet az új ajánlásokról (ha van)
  daily_report_hour: 23        # napi kimutatás ennyi órától (helyi idő), naponta egyszer

dashboard:
  enabled: true
  # Alapból ugyanennek a (nyilvános) repónak a gh-pages ágára megy, külön token nélkül.
  # Settings → Pages → Deploy from a branch → gh-pages / (root).
  repo: ""                     # külön repóhoz: "felhasznalo/repo" + DASHBOARD_TOKEN titok
  branch: gh-pages
  url: https://ferzi3dprint.github.io/tippmix_value_bot/
  pbkdf2_iterations: 600000    # csak ha DASHBOARD_PASSWORD meg van adva (különben nyílt oldal)
